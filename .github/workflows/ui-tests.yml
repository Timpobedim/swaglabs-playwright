name: ui-tests

on:
  push:
  pull_request:
  schedule:
    # Ночной прогон: магазин — внешний сайт, он может измениться без нашего участия.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Зависимости
        run: uv sync --group dev

      - name: Линтер и типы
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Браузер
        run: uv run playwright install --with-deps chromium

      - name: Тесты
        run: uv run pytest -n 4

      - name: HTML-отчёт, скриншоты и трейсы упавших тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
